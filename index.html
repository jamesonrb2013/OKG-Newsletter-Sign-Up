<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscribe to our Newsletter</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f9fafb;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 { font-size: 24px; margin-bottom: 10px; color: #111827; }
        p { font-size: 14px; color: #6b7280; margin-bottom: 20px; }
        input[type="email"] {
            width: 90%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
        }
        button {
            width: 95%;
            padding: 10px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background-color: #1d4ed8; }
    </style>
</head>
<body>

<div class="container">
    <h1>Join Our Newsletter</h1>
    <p>Enter your email below to subscribe to our latest updates.</p>
    
    <form action="https://foundermail.mx" method="post"> 
        <input type="email" name="email" placeholder="you@example.com" required> 
        <button type="submit">Subscribe</button> 
    </form>
</div>

</body>
</html>
